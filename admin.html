<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Song Request Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#111;color:#fff}
    input{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #444;background:#1d1d1d;color:#fff;box-sizing:border-box}
    button{padding:9px 14px;border:0;border-radius:9px;cursor:pointer;margin-right:6px}
    .card{padding:16px 0;border-bottom:1px solid #333}
    .new{font-weight:700} .muted{color:#aaa} .hidden{display:none}
  </style>
</head>
<body>
  <h1>🎸 Song Request Dashboard</h1>
  <section id="login">
    <p>Sign in with your Supabase user account.</p>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="signIn()">Sign in</button>
    <div id="loginMessage"></div>
  </section>

  <section id="dashboard" class="hidden">
    <button onclick="signOut()">Sign out</button>
    <button onclick="loadRequests()">Refresh</button>
    <h2>Requests</h2>
    <div id="requests">Loading…</div>
  </section>

  <script>
    const client = supabase.createClient("https://uzqaqzzzgjgjkhlgggvi.supabase.co", "sb_publishable_YpXBQjPwts2oAZEgvCuQOg_VZvhGSSV");

    async function signIn() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await client.auth.signInWithPassword({ email, password });
      document.getElementById('loginMessage').textContent = error ? error.message : '';
      if (!error) showDashboard();
    }

    async function signOut() {
      await client.auth.signOut();
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');
    }

    async function showDashboard() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      await loadRequests();
    }

    async function loadRequests() {
      const { data, error } = await client.from('requests')
        .select('id,requester_name,status,created_at,songs(title,artist)')
        .order('created_at', { ascending: true });
      const box = document.getElementById('requests');
      if (error) { box.textContent = 'Could not load requests: ' + error.message; return; }
      box.innerHTML = (data || []).map(r => `
        <div class="card">
          <div class="${r.status === 'new' ? 'new' : ''}">
            ${escapeHtml(r.requester_name)} — ${escapeHtml(r.songs?.title || 'Unknown song')}
          </div>
          <div class="muted">${new Date(r.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · ${r.status}</div>
          <div style="margin-top:8px">
            <button onclick="setStatus(${r.id}, 'played')">Played</button>
            <button onclick="setStatus(${r.id}, 'skipped')">Skip</button>
            <button onclick="setStatus(${r.id}, 'new')">Reset</button>
          </div>
        </div>`).join('') || '<p>No requests yet.</p>';
    }

    async function setStatus(id, status) {
      const { error } = await client.from('requests').update({ status }).eq('id', id);
      if (!error) loadRequests();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    async function checkSession() {
      const { data } = await client.auth.getSession();
      if (data.session) showDashboard();
    }

    checkSession();
    setInterval(() => {
      if (!document.getElementById('dashboard').classList.contains('hidden')) loadRequests();
    }, 5000);
  </script>
</body>
</html>
